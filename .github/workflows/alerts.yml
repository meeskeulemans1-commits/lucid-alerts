name: lucid-alerts
on:
  schedule:
    - cron: "5,35 7-21 * * 1-5"   # GitHub start soms te laat; elke run blijft ~55 min actief en controleert elke 30 s
  workflow_dispatch: {}
concurrency:
  group: lucid-alerts
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Herstel gemelde signalen
        uses: actions/cache@v4
        with:
          path: alerts_sent.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Controleer signalen (loop)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITAL_EMAIL }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
        run: python lucid_alerts.py --topic "$NTFY_TOPIC" --loop 3200 --every 30
